name: CI

on:
  push:
  pull_request:
    branches: [ $default-branch ]
  release:
    types:
      - created

jobs:
  test:
    name: "OTP ${{ matrix.otp }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        otp: [27, 28, 29]
      fail-fast: false
    container:
      image: erlang:${{ matrix.otp }}
    steps:
    - uses: actions/checkout@v7
    - name: Test
      run: make
    - name: Upload CT logs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ct-logs-otp-${{ matrix.otp }}
        path: _build/test/logs
        if-no-files-found: ignore
        retention-days: 14
